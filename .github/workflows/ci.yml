name: CI

on:
  pull_request:

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      java: ${{ steps.diff.outputs.java }}
      frontend: ${{ steps.diff.outputs.frontend }}
      e2e: ${{ steps.diff.outputs.e2e }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: diff
        run: |
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          # root Gradle files and this workflow affect every Java module
          shared='^(build\.gradle|settings\.gradle|gradlew|gradle/|\.github/workflows/ci\.yml)'
          modules=()
          for m in rfr-auth rfr-api rfr-e2e; do
            grep -qE "^$m/|$shared" <<< "$files" && modules+=("$m")
          done
          echo "java=$(printf '%s\n' "${modules[@]}" | jq -Rc 'select(length > 0)' | jq -sc .)" >> "$GITHUB_OUTPUT"
          grep -qE '^rfr-gql-client/|^\.github/workflows/ci\.yml' <<< "$files" \
            && echo "frontend=true" >> "$GITHUB_OUTPUT" || echo "frontend=false" >> "$GITHUB_OUTPUT"
          grep -qE "^(rfr-auth|rfr-api|rfr-e2e|rfr-gql-client)/|$shared" <<< "$files" \
            && echo "e2e=true" >> "$GITHUB_OUTPUT" || echo "e2e=false" >> "$GITHUB_OUTPUT"

  java:
    needs: changes
    if: needs.changes.outputs.java != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ${{ fromJSON(needs.changes.outputs.java) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      # rfr-e2e: compile only, its tests need a running stand
      - run: ./gradlew :${{ matrix.module }}:${{ matrix.module == 'rfr-e2e' && 'testClasses' || 'build' }}

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rfr-gql-client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rfr-gql-client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  e2e:
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4.7
        env:
          MYSQL_ROOT_PASSWORD: secret
        ports:
          - 3306:3306
        # the job's steps start only once MySQL accepts connections
        options: >-
          --health-cmd "mysqladmin ping -h localhost -uroot -psecret"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rfr-gql-client/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :rfr-e2e:installPlaywrightWithDeps
      # runAll skips MySQL here: the services container already holds :3306
      - run: ./gradlew runAll
      - name: Wait for the stand
        run: |
          for port in 9001 8081 3001; do
            timeout 180 bash -c "until (exec 3<>/dev/tcp/localhost/$port) 2>/dev/null; do sleep 1; done" \
              || { echo "nothing listens on :$port after 3 minutes"; exit 1; }
          done
      - run: ./gradlew e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: allure-results
          path: rfr-e2e/build/allure-results
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: stand-logs
          path: build/logs
