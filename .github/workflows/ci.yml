name: CI

on:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v4
      # not the root `build`: it would also run :rfr-e2e:test, which needs a running stand
      - run: ./gradlew :rfr-auth:build :rfr-api:build :rfr-e2e:testClasses

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rfr-gql-client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rfr-gql-client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
