plugins {
    id 'io.qameta.allure' version '4.3.0'
}

group = 'io.student'
version = '1.0.0'

def allureJavaVersion = '3.0.0'
def allureReportVersion = '3.17.0'
def aspectJVersion = '1.9.25.1'
def junitVersion = '6.1.3'
def playwrightVersion = '1.63.0'
def springBootVersion = '4.1.1'
def flywayVersion = rootProject.project(':rfr-api').flywayVersion
def browser = System.getProperty('rfr.browser') ?: System.getenv('RFR_BROWSER') ?: 'chromium'

configurations {
    agent {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    agent "org.aspectj:aspectjweaver:$aspectJVersion"

    testImplementation platform("org.junit:junit-bom:$junitVersion")
    testImplementation platform("io.qameta.allure:allure-bom:$allureJavaVersion")
    testImplementation platform("org.springframework.boot:spring-boot-dependencies:$springBootVersion")

    testImplementation "io.qameta.allure:allure-jupiter"
    testImplementation "io.qameta.allure:allure-playwright"
    testImplementation "com.microsoft.playwright:playwright:$playwrightVersion"

    testImplementation "org.springframework:spring-jdbc"
    testImplementation "org.springframework.security:spring-security-crypto"
    testImplementation "tools.jackson.core:jackson-databind"
    testRuntimeOnly "com.mysql:mysql-connector-j"
    testImplementation "org.flywaydb:flyway-core:$flywayVersion"
    testRuntimeOnly "org.flywaydb:flyway-mysql:$flywayVersion"

    testImplementation "org.junit.jupiter:junit-jupiter"
    testImplementation "org.junit.platform:junit-platform-testkit"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher"
    testRuntimeOnly "org.aspectj:aspectjrt:$aspectJVersion"
}


allure {
    version = allureReportVersion
    adapter {
        autoconfigure.set(false)
    }
}

tasks.register('installPlaywright', JavaExec) {
    group = 'verification'
    description = 'Downloads the browser from rfr.browser (chromium by default) for the tests'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args 'install', browser
}

tasks.register('installPlaywrightWithDeps', JavaExec) {
    group = 'verification'
    description = 'Downloads the browser from rfr.browser together with the system libraries it needs on Linux (CI)'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args 'install', '--with-deps', browser
}

tasks.register('showTrace', JavaExec) {
    group = 'verification'
    description = 'Opens a Playwright trace in Trace Viewer: -Ptrace=<path to trace.zip>'
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.microsoft.playwright.CLI'
    args 'show-trace', providers.gradleProperty('trace').getOrElse('')
}

def commitHash = providers.exec {
    commandLine 'git', 'rev-parse', '--short', 'HEAD'
    ignoreExitValue = true
}.standardOutput.asText.map { it.trim() ?: 'unknown' }.getOrElse('unknown')

tasks.withType(Test).configureEach {
    // results depend on the running stand, not only on the test code, so never reuse a previous run
    outputs.upToDateWhen { false }
    jvmArgumentProviders.add({ ["-javaagent:${configurations.agent.singleFile}"] } as CommandLineArgumentProvider)
    systemProperty 'rfr.authMigrations', rootProject.file('rfr-auth/src/main/resources/db/migration/rangiffler-auth').absolutePath
    systemProperty 'rfr.apiMigrations', rootProject.file('rfr-api/src/main/resources/db/migration/rangiffler-api').absolutePath
    systemProperty 'rfr.commit', commitHash
}

test {
    useJUnitPlatform {
        excludeTags 'probe-target'
    }
    // an explicit --tests filter may pick a single UI test, so UI tests are excluded only without one
    doFirst {
        if (filter.commandLineIncludePatterns.empty) {
            options { excludeTags 'ui' }
        }
    }
    // tests run in a forked JVM, so -Drfr.* given to Gradle has to be passed on explicitly
    systemProperties System.getProperties().findAll { it.key.toString().startsWith('rfr.') }
}

tasks.register('e2e', Test) {
    group = 'verification'
    description = 'Runs UI tests against an already running stand (./gradlew runAll)'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'ui'
        excludeTags 'probe-target'
    }
    systemProperty 'rfr.migrationCheck', 'true'
    systemProperties System.getProperties().findAll { it.key.toString().startsWith('rfr.') }
}
