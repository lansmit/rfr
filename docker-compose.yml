services:
  mysql:
    image: mysql:8.4.7
    container_name: rfr-mysql
    environment:
      MYSQL_ROOT_PASSWORD: secret
    ports:
      - "3306:3306"
    volumes:
      - mysql-volume:/var/lib/mysql
    # lets `docker compose up --wait` return only once MySQL accepts connections, not when the container starts
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-psecret"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  mysql-volume:
    # same volume as localenv.sh, so existing data is kept
    name: mysql-volume
